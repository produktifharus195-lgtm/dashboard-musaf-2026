<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard MUSAF 2026 V2</title><style>

:root{--green:#54316F;--mint:#F1E8F8;--bg:#F8F5FC;--line:#E4D9EB;--ink:#251339;--muted:#786987;--red:#A92F5B;--gold:#D8AD57;--gold-light:#F5E5B5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(115deg,#251339 0%,#452362 65%,#5C3376 100%);color:white;padding:27px max(18px,calc((100vw - 1050px)/2));border-bottom:4px solid var(--gold)}
header .small{color:var(--gold-light);letter-spacing:.08em;text-transform:uppercase}
h1{font-size:29px;line-height:1.2;margin:7px 0 10px;letter-spacing:-.025em}header p{margin:0;color:#E9DDF2}
.wrap{max-width:1050px;margin:auto;padding:20px 18px}
nav{display:flex;gap:8px;overflow:auto;padding:4px 0 17px;scrollbar-width:thin}
button,.btn{border:1px solid transparent;border-radius:10px;padding:10px 13px;background:var(--green);color:white;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
button:hover:not(:disabled){filter:brightness(1.06)}button:active:not(:disabled){transform:translateY(1px)}
nav button{white-space:nowrap;background:#fff;color:var(--ink);border:1px solid var(--line)}
nav button.active{background:var(--green);color:#fff;border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #2513390a}
.card h2{margin:0 0 12px;font-size:18px;color:var(--ink)}.stat{font-size:29px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}
.bar{height:10px;border-radius:30px;background:#EEE7F4;overflow:hidden;margin:9px 0}.bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:30px}
.flex{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:11px;background:var(--mint);color:var(--green);padding:3px 8px;border-radius:20px;border:1px solid #E4D9EB}
.task{border-top:1px solid var(--line);padding:13px 0}.task:first-of-type{border-top:0}.task strong{display:block}
.task label{display:flex;gap:9px;align-items:flex-start}.task input[type=checkbox]{margin-top:4px;accent-color:var(--green);width:17px;height:17px}
.outline{background:#fff;color:var(--green);border:1px solid #CEBBDD}.danger{color:var(--red);border-color:#EFCBD8}.tiny{padding:6px 9px;font-size:12px}
input,select,textarea{width:100%;border:1px solid #D6C9DF;border-radius:9px;padding:10px;background:white;font:inherit;color:var(--ink)}textarea{min-height:72px}
form{display:grid;gap:11px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px}.fields label{display:block;font-weight:600;font-size:12px}.fields input,.fields select{margin-top:4px}
.hidden{display:none!important}.notice{padding:12px 14px;border-radius:11px;background:#FFF5DF;color:#69480d;margin-bottom:13px;border:1px solid #F1E3C2}
.good{background:#EEE7F5;color:#49276A;border-color:#DED0E9}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:590px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#F4EFF8}
footer{text-align:center;color:var(--muted);padding:24px}.right{text-align:right}.progress-row{margin:13px 0}
dialog{border:1px solid var(--line);border-radius:16px;max-width:520px;width:calc(100% - 24px);padding:22px;box-shadow:0 20px 80px #25133944;color:var(--ink)}dialog::backdrop{background:#2513399c}
.warning{color:#996312}a{color:var(--green)}
button:disabled{opacity:.45;cursor:not-allowed}.auth{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.pill{background:var(--mint);color:var(--green);padding:5px 10px;border-radius:20px;font-size:12px}.rowactions{display:flex;gap:6px}
.muted-box{background:#F4EFF8;padding:12px;border-radius:10px}.note{font-size:12px;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:550px){h1{font-size:24px}.wrap{padding:12px}.card{padding:14px}header{padding-top:23px;padding-bottom:23px}}


/* Header Premium: LDKS FSH utama, Kabinet Arunika Rasa pendamping */
.musaf-hero{position:relative;isolation:isolate;overflow:hidden;padding:38px max(20px,calc((100vw - 1150px)/2)) 39px;background:radial-gradient(circle at 77% 12%,rgba(211,160,89,.15),transparent 26%),radial-gradient(circle at 4% 94%,rgba(188,120,229,.18),transparent 36%),linear-gradient(115deg,#190e2c 0%,#35184b 47%,#5d2d75 100%);border-bottom:4px solid #d7ad63;box-shadow:0 9px 30px #29113d26}
.musaf-hero:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 69px,rgba(255,255,255,.018) 70px 71px)}
.hero-inner{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 230px;align-items:center;gap:28px;max-width:1150px;margin:auto}
.hero-identity{min-width:0;display:flex;align-items:center;gap:28px}
.hero-primary-logo{width:165px;min-width:165px;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:15px 12px 10px;border:1px solid rgba(244,203,126,.75);border-radius:23px;background:linear-gradient(150deg,#fff,#f7f2f8);box-shadow:0 14px 36px #10071b55,0 0 0 5px #ffffff0c}
.hero-primary-logo img{display:block;width:139px;max-width:100%;height:151px;object-fit:contain}
.primary-logo-label{margin-top:5px;color:#75568a;letter-spacing:.18em;font-weight:800;font-size:9px;text-align:center}
.hero-content{min-width:0}.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:#f1d5a6;font-weight:750;line-height:1.5;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.hero-eyebrow-line,.small-gold-line{display:inline-block;width:25px;height:2px;background:#d8ad57}
.hero-dot{color:#dfb771}.hero-rule{height:1px;width:100%;max-width:445px;background:linear-gradient(90deg,#e0b56b66,transparent);margin:14px 0 17px}
.musaf-hero h1{color:#fff;line-height:1.10;font-size:clamp(29px,3.6vw,45px);font-weight:850;letter-spacing:-.035em;margin:0 0 12px}
.musaf-hero h1 span{display:block;color:#f1cf8d}
.musaf-hero p{max-width:530px;font-size:14px;line-height:1.75;color:#efe2f3;margin:0}
.hero-tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.hero-tags span{background:#ffffff12;border:1px solid #e1bb7f66;border-radius:100px;color:#fbf3ff;padding:7px 12px;font-size:11px;white-space:nowrap}
.hero-tags b{font-weight:800;color:#f7d792;margin-left:3px}
.hero-companion{border:1px solid #e9c88955;border-radius:20px;min-width:0;padding:15px 13px 13px;background:linear-gradient(150deg,#ffffff1b,#ffffff08);box-shadow:inset 0 1px 0 #ffffff25;text-align:center;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.companion-heading{color:#f5d79d;font-size:10px;letter-spacing:.12em;font-weight:750;display:flex;align-items:center;gap:8px}.small-gold-line{width:16px}
.hero-companion img{width:100%;max-width:205px;height:122px;object-fit:contain;border-radius:12px;background:#fffffffa;padding:10px 7px;box-shadow:0 5px 18px #10051b44}
.companion-caption{font-size:10px;letter-spacing:.1em;color:#ebe0ee;font-weight:750}.companion-caption span{color:#e5bf7a}
.hero-filigree{position:absolute;bottom:-95px;right:-84px;border:1px solid #ffffff12;border-radius:50%;height:310px;width:310px;z-index:-1;pointer-events:none}
@media(max-width:900px){.musaf-hero{padding:27px 18px 31px}.hero-inner{grid-template-columns:minmax(0,1fr) 175px;gap:16px}.hero-identity{gap:17px}.hero-primary-logo{min-width:120px;width:120px;min-height:160px;padding:12px 8px}.hero-primary-logo img{width:101px;height:122px}.hero-companion img{height:100px}.hero-eyebrow{font-size:10px}}
@media(max-width:640px){.musaf-hero{padding:22px 15px 24px}.hero-inner{grid-template-columns:minmax(0,1fr);gap:17px}.hero-identity{align-items:center;gap:15px}.hero-primary-logo{min-width:106px;width:106px;min-height:145px;border-radius:16px}.hero-primary-logo img{width:92px;height:108px}.primary-logo-label{font-size:7px;letter-spacing:.07em}.hero-content{flex:1}.hero-eyebrow{font-size:9px;letter-spacing:.05em;gap:5px}.hero-eyebrow-line{width:12px}.hero-rule{margin:8px 0 10px}.musaf-hero h1{font-size:clamp(23px,5.5vw,32px);margin:0 0 7px}.musaf-hero p{font-size:11px;line-height:1.65}.hero-tags{margin-top:12px;gap:5px}.hero-tags span{padding:5px 8px;font-size:9px}.hero-companion{flex-direction:row;justify-content:space-between;padding:9px 11px;gap:10px;align-self:auto;border-radius:13px}.hero-companion img{margin-left:auto;width:145px;max-width:50%;height:57px;order:2;padding:4px}.companion-heading{font-size:9px;line-height:1.5;letter-spacing:.04em;text-align:left}.companion-caption{display:none}}
@media(max-width:370px){.hero-identity{gap:10px}.hero-primary-logo{min-width:89px;width:89px;min-height:124px}.hero-primary-logo img{width:75px;height:90px}.musaf-hero h1{font-size:21px}.hero-tags span{font-size:8px}}
</style></head><body>

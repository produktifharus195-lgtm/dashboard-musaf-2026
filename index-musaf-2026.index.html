<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard MUSAF 2026</title><style>
:root{--green:#14543e;--mint:#eaf5ef;--bg:#f4f7f5;--line:#dce8df;--ink:#17382d;--muted:#66786e;--red:#a92f3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{background:var(--green);color:#fff;padding:22px max(18px,calc((100vw - 1050px)/2))}h1{font-size:26px;margin:4px 0}header p{margin:0;opacity:.86}.wrap{max-width:1050px;margin:auto;padding:18px}nav{display:flex;gap:7px;overflow:auto;padding:4px 0 15px}button,.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--green);color:white;font:inherit;font-weight:600;cursor:pointer}nav button{white-space:nowrap;background:#fff;color:var(--ink);border:1px solid var(--line)}nav button.active{background:var(--green);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:13px;box-shadow:0 2px 9px #183b2b07}.card h2{margin:0 0 12px;font-size:18px}.stat{font-size:28px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}.bar{height:9px;border-radius:30px;background:#e6ede8;overflow:hidden;margin:9px 0}.bar>div{height:100%;background:#2b9b68}.flex{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tag{font-size:11px;background:var(--mint);padding:3px 8px;border-radius:20px}.task{border-top:1px solid var(--line);padding:12px 0}.task:first-of-type{border-top:0}.task strong{display:block}.task label{display:flex;gap:9px;align-items:flex-start}.task input[type=checkbox]{margin-top:4px;accent-color:var(--green);width:17px;height:17px}.outline{background:#fff;color:var(--green);border:1px solid #abcdb9}.danger{color:var(--red);border-color:#efcbd0}.tiny{padding:6px 9px;font-size:12px}input,select,textarea{width:100%;border:1px solid #cadbd0;border-radius:9px;padding:10px;background:white;font:inherit;color:var(--ink)}textarea{min-height:72px}form{display:grid;gap:11px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px}.fields label{display:block;font-weight:600;font-size:12px}.fields input,.fields select{margin-top:4px}.hidden{display:none!important}.notice{padding:10px 13px;border-radius:10px;background:#fff5df;color:#69480d;margin-bottom:13px}.good{background:#e8f7ee;color:#1c6740}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:590px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#f4f8f5}footer{text-align:center;color:var(--muted);padding:24px}.right{text-align:right}.progress-row{margin:13px 0}dialog{border:0;border-radius:16px;max-width:520px;width:calc(100% - 24px);padding:22px;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#14281d8a}.warning{color:#a14e00}a{color:var(--green)}@media(max-width:550px){h1{font-size:23px}.wrap{padding:12px}.card{padding:14px}}
</style></head><body>
<header><div class="small">LDKS FSH • KEPANITIAAN 2026</div><h1>Dashboard MUSAF 2026</h1><p>Koordinasi divisi, tugas, dan kesiapan acara secara real-time</p></header>
<div class="wrap"><div id="connection" class="notice">⏳ Menghubungkan Firebase…</div><nav id="tabs"><button data-tab="home" class="active">Beranda</button><button data-tab="pra">Pra-MUSAF</button><button data-tab="musaf">MUSAF</button><button data-tab="division">Divisi & Tugas</button><button data-tab="finance">Keuangan</button><button data-tab="report">Laporan</button></nav><main id="main"></main></div><footer>LDKS FSH • MUSAF 2026 · Data tersimpan di Firebase</footer>
<dialog id="taskDialog"><div class="flex"><h2 id="dialogTitle">Tambah Tugas</h2><button class="outline tiny" id="closeDialog">Tutup</button></div><form id="taskForm"><input type="hidden" id="taskId"><div class="fields"><label>Agenda<select id="taskAgenda"><option value="pra">Pra-MUSAF</option><option value="musaf">MUSAF</option></select></label><label>Divisi<select id="taskDivision"></select></label></div><label>Nama tugas<input id="taskTitle" required maxlength="160" placeholder="Contoh: Membuat ID card panitia"></label><div class="fields"><label>PIC<input id="taskPic" maxlength="90" placeholder="Nama penanggung jawab"></label><label>Deadline<input id="taskDeadline" type="date"></label></div><div class="fields"><label>Prioritas<select id="taskPriority"><option>Rendah</option><option selected>Sedang</option><option>Tinggi</option><option>Mendesak</option></select></label><label>Status<select id="taskStatus"><option value="todo">Belum dikerjakan</option><option value="doing">Dalam proses</option><option value="done">Selesai</option></select></label></div><label>Catatan<textarea id="taskNotes" maxlength="1000" placeholder="Kendala, kebutuhan, atau informasi tambahan"></textarea></label><button type="submit">Simpan tugas</button></form></dialog>
<dialog id="financeDialog"><div class="flex"><h2>Catat Transaksi / RAB</h2><button class="outline tiny" id="closeFinance">Tutup</button></div><form id="financeForm"><div class="fields"><label>Jenis<select id="financeType"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option><option value="budget">Rencana Anggaran (RAB)</option></select></label><label>Agenda<select id="financeAgenda"><option value="pra">Pra-MUSAF</option><option value="musaf">MUSAF</option></select></label></div><div class="fields"><label>Tanggal<input type="date" id="financeDate" required></label><label>Divisi<select id="financeDivision"></select></label></div><label>Uraian<input id="financeTitle" maxlength="160" required placeholder="Contoh: Snack peserta"></label><label>Nominal (Rp)<input id="financeAmount" type="number" min="1" step="1" required></label><label>Catatan / nomor bukti<input id="financeNotes" maxlength="300" placeholder="Simpan bukti transaksi di arsip terpisah"></label><button type="submit">Simpan catatan</button></form></dialog>
<script type="module">
// ISI DENGAN FIREBASE CONFIG DARI PROJECT FIREBASE MILIKMU.

const firebaseConfig={apiKey:"ISI_API_KEY",authDomain:"sk-ldk-syahid-2026.firebaseapp.com",databaseURL:"https://sk-ldk-syahid-2026-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sk-ldk-syahid-2026",appId:"ISI_APP_ID"};
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import{getDatabase,ref,onValue,set,update,push,remove}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const divisions=['Ketua Pelaksana','Sekretaris Umum','Bendahara Umum','Acara','PDD','Konsumsi','Perlengkapan'];
const seed={pra:{'Ketua Pelaksana':['Rapat koordinasi awal','Monitoring progres semua divisi','Konfirmasi kesiapan venue dan teknis','Evaluasi akhir sebelum hari-H'],'Sekretaris Umum':['Surat peminjaman tempat','Surat undangan peserta dan pengurus','Surat permohonan fasilitas/peralatan','Daftar hadir','Notulensi dan berita acara','Arsip surat masuk dan keluar'],'Bendahara Umum':['Susun RAB Pra-MUSAF','Catat sumber pemasukan','Catat realisasi pengeluaran dan bukti','Rekap saldo dan evaluasi anggaran'],Acara:['Susun rundown Pra-MUSAF','Siapkan perangkat acara/persidangan','Buat PPT slide','Kumpulkan visi-misi bakal calon (BALON)','Koordinasi MC, operator dan pengisi acara','Gladi bersih'],PDD:['Flyer coming soon','Flyer countdown','Flyer utama','Template flyer live report','Flyer dokumentasi','Pembagian tugas desain dan dokumentasi','Publikasi hasil kegiatan'],Konsumsi:['Data jumlah peserta dan panitia','Snack ringan','Air mineral','Koordinasi vendor konsumsi','Jadwal distribusi dan konsumsi cadangan'],Perlengkapan:['Konfirmasi tempat acara','Penataan meja dan kursi','Mic dan sound system','Proyektor dan layar','Laptop operator dan kabel HDMI','Terminal listrik dan pengecekan teknis']},musaf:{'Ketua Pelaksana':['Koordinasi seluruh divisi dua hari','Pastikan venue dan penginapan','Konfirmasi pemateri dan agenda LPJ','Monitoring pelaksanaan dan evaluasi sesi'],'Sekretaris Umum':['Surat undangan pemateri','Surat permohonan tempat dan penginapan','Undangan peserta/pengurus','Daftar hadir dua hari','Administrasi sidang dan berita acara','Arsip hasil MUSAF'],'Bendahara Umum':['Susun RAB MUSAF dua hari','Anggaran penginapan dan konsumsi','Anggaran pemateri/transport bila ada','Catat pemasukan dan pengeluaran','Siapkan dana cadangan dan LPJ keuangan'],Acara:['Rundown MUSAF dua hari','Konfirmasi pemateri dan materi pembuka sebelum LPJ','Siapkan PPT dan operator','Perangkat sidang dan dokumen LPJ','Koordinasi sesi pemilihan dan pelantikan','Gladi bersih'],PDD:['Flyer utama MUSAF','Flyer pemateri','Countdown dan publikasi acara','Live report dua hari','Dokumentasi LPJ dan pelantikan','Pembagian shift dokumentasi','Publikasi hasil dan foto bersama'],Konsumsi:['Data jumlah peserta yang menginap','Jadwal makan dua hari','Snack dan air mineral','Konsumsi pemateri','Distribusi konsumsi dan cadangan'],Perlengkapan:['Konfirmasi tempat dan penginapan','Pembagian kamar/area tidur','Fasilitas mandi dan kebersihan','Mic, sound system, proyektor, layar','Kabel HDMI, laptop, terminal listrik','Penataan ruang sidang dan area istirahat','Pengecekan listrik dan logistik']}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),agendaName=a=>a==='pra'?'Pra-MUSAF':'MUSAF',statusName=s=>({todo:'Belum dikerjakan',doing:'Dalam proses',done:'Selesai'})[s]||'Belum dikerjakan';
let db,base,connected=false,tab='home',selectedDivision='Semua Divisi',state={tasks:{},finance:{}};const getTasks=()=>Object.entries(state.tasks||{}).map(([id,t])=>({id,...t})),getFinance=()=>Object.entries(state.finance||{}).map(([id,f])=>({id,...f}));
function stat(tasks){return{total:tasks.length,done:tasks.filter(t=>t.status==='done').length,doing:tasks.filter(t=>t.status==='doing').length,late:tasks.filter(t=>t.deadline&&t.deadline<new Date().toISOString().slice(0,10)&&t.status!=='done').length}}function percent(s){return s.total?Math.round(100*s.done/s.total):0}function progress(tasks){let s=stat(tasks);return `<div class="bar"><div style="width:${percent(s)}%"></div></div><div class="small muted">${s.done}/${s.total} selesai • ${percent(s)}%</div>`}function header(title,button=true){return `<div class="flex"><h2>${title}</h2>${button?'<button class="tiny" data-add="1">+ Tambah Tugas</button>':''}</div>`}
function taskHtml(t){return `<div class="task"><div class="flex"><label><input type="checkbox" data-check="${esc(t.id)}" ${t.status==='done'?'checked':''}><span><strong>${esc(t.title)}</strong><span class="small muted">${esc(t.division)} · ${agendaName(t.agenda)} · ${esc(t.pic||'PIC belum ditentukan')}</span></span></label><div><button class="outline tiny" data-edit="${esc(t.id)}">Edit</button> <button class="outline danger tiny" data-delete="${esc(t.id)}">Hapus</button></div></div><div class="small muted" style="margin:6px 0 0 27px">${esc(statusName(t.status))} · Prioritas ${esc(t.priority||'Sedang')}${t.deadline?' · Deadline '+esc(t.deadline):''}${t.notes?' · '+esc(t.notes):''}</div></div>`}
function render(){const tasks=getTasks(),fin=getFinance(),s=stat(tasks),p=stat(tasks.filter(t=>t.agenda==='pra')),m=stat(tasks.filter(t=>t.agenda==='musaf'));let html='';if(tab==='home'){html=`<div class="grid"><div class="card"><div class="muted">Seluruh tugas</div><div class="stat">${s.total}</div></div><div class="card"><div class="muted">Selesai</div><div class="stat">${s.done}</div></div><div class="card"><div class="muted">Dalam proses</div><div class="stat">${s.doing}</div></div><div class="card"><div class="muted">Terlambat</div><div class="stat">${s.late}</div></div></div><div class="grid"><div class="card"><h2>Pra-MUSAF</h2><div class="muted">21/22 November 2026 • tanggal tentatif</div>${progress(tasks.filter(t=>t.agenda==='pra'))}</div><div class="card"><h2>MUSAF</h2><div class="muted">5–6 Desember 2026 • menginap</div>${progress(tasks.filter(t=>t.agenda==='musaf'))}</div></div><div class="card"><h2>Progres per Divisi</h2>${divisions.map(d=>`<div class="progress-row"><strong>${esc(d)}</strong>${progress(tasks.filter(t=>t.division===d))}</div>`).join('')}</div><div class="card">${header('Tugas Mendesak / Terlambat')}${tasks.filter(t=>t.status!=='done'&&(t.priority==='Mendesak'||t.priority==='Tinggi'||(t.deadline&&t.deadline<new Date().toISOString().slice(0,10)))).slice(0,15).map(taskHtml).join('')||'<p class="muted">Belum ada tugas prioritas tinggi yang tertunda.</p>'}</div>`}
else if(tab==='pra'||tab==='musaf'){const t=tasks.filter(x=>x.agenda===tab);html=`<div class="card"><h2>${agendaName(tab)} ${tab==='pra'?'• 21/22 November (tentatif)':'• 5–6 Desember (menginap)'}</h2>${progress(t)}</div>`+divisions.map(d=>`<div class="card">${header(esc(d))}${t.filter(x=>x.division===d).map(taskHtml).join('')||'<p class="muted">Belum ada tugas.</p>'}</div>`).join('')}
else if(tab==='division'){const t=selectedDivision==='Semua Divisi'?tasks:tasks.filter(x=>x.division===selectedDivision);html=`<div class="card">${header('Divisi & Tugas')}<label>Filter divisi <select id="divisionFilter">${['Semua Divisi',...divisions].map(d=>`<option ${d===selectedDivision?'selected':''}>${esc(d)}</option>`).join('')}</select></label>${progress(t)}${t.map(taskHtml).join('')}</div>`}
else if(tab==='finance'){const income=fin.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0),expense=fin.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0),budget=fin.filter(x=>x.type==='budget').reduce((a,x)=>a+Number(x.amount||0),0);html=`<div class="notice">⚠️ Modul keuangan versi awal. Jangan isi transaksi sebenarnya sebelum login dan aturan akses bendahara diterapkan.</div><div class="grid"><div class="card"><div class="muted">RAB</div><div class="stat" style="font-size:21px">${money(budget)}</div></div><div class="card"><div class="muted">Pemasukan</div><div class="stat" style="font-size:21px">${money(income)}</div></div><div class="card"><div class="muted">Pengeluaran</div><div class="stat" style="font-size:21px">${money(expense)}</div></div><div class="card"><div class="muted">Saldo</div><div class="stat" style="font-size:21px">${money(income-expense)}</div></div></div><div class="card"><div class="flex"><h2>RAB & Arus Kas</h2><div><button class="outline tiny" id="exportFinance">Ekspor CSV</button> <button class="tiny" id="addFinance">+ Catatan</button></div></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Agenda</th><th>Jenis</th><th>Divisi</th><th>Uraian</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${fin.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(f=>`<tr><td>${esc(f.date)}</td><td>${agendaName(f.agenda)}</td><td>${({income:'Masuk',expense:'Keluar',budget:'RAB'})[f.type]}</td><td>${esc(f.division)}</td><td>${esc(f.title)}<div class="small muted">${esc(f.notes||'')}</div></td><td>${money(f.amount)}</td><td><button class="outline danger tiny" data-delete-fin="${esc(f.id)}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="7">Belum ada catatan keuangan.</td></tr>'}</tbody></table></div></div>`}
else{html=`<div class="card"><h2>Rekap MUSAF 2026</h2><p class="muted">Salin ringkasan progres untuk dikirim ke grup WhatsApp panitia.</p><button id="copyReport">Salin Rekap WhatsApp</button></div><div class="card"><h2>Ringkasan Divisi</h2>${divisions.map(d=>`<div class="progress-row"><strong>${esc(d)}</strong>${progress(tasks.filter(t=>t.division===d))}</div>`).join('')}</div>`}
$('main').innerHTML=html;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openTask(null,tab==='musaf'?'musaf':'pra'));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTask(state.tasks[b.dataset.edit],null,b.dataset.edit));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>saveTask(b.dataset.check,{status:b.checked?'done':'todo'}));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus tugas ini?'))await remove(ref(db,base+'/tasks/'+b.dataset.delete))});document.querySelectorAll('[data-delete-fin]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus catatan ini?'))await remove(ref(db,base+'/finance/'+b.dataset.deleteFin))});if($('divisionFilter'))$('divisionFilter').onchange=e=>{selectedDivision=e.target.value;render()};if($('addFinance'))$('addFinance').onclick=()=>{$('financeDate').value=new Date().toISOString().slice(0,10);$('financeDialog').showModal()};if($('exportFinance'))$('exportFinance').onclick=()=>{const rows=[['Tanggal','Agenda','Jenis','Divisi','Uraian','Nominal','Catatan'],...fin.map(f=>[f.date,agendaName(f.agenda),f.type,f.division,f.title,f.amount,f.notes||''])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rekap-keuangan-musaf-2026.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};if($('copyReport'))$('copyReport').onclick=async()=>{let msg='*REKAP KEPANITIAAN MUSAF 2026*\nPra-MUSAF: '+p.done+'/'+p.total+' selesai\nMUSAF: '+m.done+'/'+m.total+' selesai\n\n'+divisions.map(d=>{let x=stat(tasks.filter(t=>t.division===d));return '• '+d+': '+x.done+'/'+x.total+' ('+percent(x)+'%)'}).join('\n')+'\n\nTugas terlambat: '+s.late;try{await navigator.clipboard.writeText(msg);alert('Rekap berhasil disalin')}catch{prompt('Salin teks berikut:',msg)}}}
function openTask(t,agenda='pra',id=''){$('dialogTitle').textContent=id?'Edit Tugas':'Tambah Tugas';$('taskId').value=id;$('taskAgenda').value=t?.agenda||agenda||'pra';$('taskDivision').value=t?.division||'Acara';$('taskTitle').value=t?.title||'';$('taskPic').value=t?.pic||'';$('taskDeadline').value=t?.deadline||'';$('taskPriority').value=t?.priority||'Sedang';$('taskStatus').value=t?.status||'todo';$('taskNotes').value=t?.notes||'';$('taskDialog').showModal()}
async function saveTask(id,patch){try{await update(ref(db,base+'/tasks/'+id),patch)}catch(e){alert('Gagal menyimpan: '+e.message)}}
$('taskForm').onsubmit=async e=>{e.preventDefault();const id=$('taskId').value;const data={agenda:$('taskAgenda').value,division:$('taskDivision').value,title:$('taskTitle').value.trim(),pic:$('taskPic').value.trim(),deadline:$('taskDeadline').value,priority:$('taskPriority').value,status:$('taskStatus').value,notes:$('taskNotes').value.trim(),updatedAt:Date.now()};try{if(id)await update(ref(db,base+'/tasks/'+id),data);else await set(push(ref(db,base+'/tasks')), {...data,createdAt:Date.now()});$('taskDialog').close()}catch(err){alert('Gagal menyimpan: '+err.message)}};
$('financeForm').onsubmit=async e=>{e.preventDefault();const data={type:$('financeType').value,agenda:$('financeAgenda').value,date:$('financeDate').value,division:$('financeDivision').value,title:$('financeTitle').value.trim(),amount:Number($('financeAmount').value),notes:$('financeNotes').value.trim(),createdAt:Date.now()};try{await set(push(ref(db,base+'/finance')),data);$('financeForm').reset();$('financeDialog').close()}catch(err){alert('Gagal menyimpan: '+err.message)}};
$('closeDialog').onclick=()=>$('taskDialog').close();$('closeFinance').onclick=()=>$('financeDialog').close();for(const id of ['taskDivision','financeDivision'])$(id).innerHTML=divisions.map(d=>`<option>${esc(d)}</option>`).join('');$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()};
async function start(){if(firebaseConfig.apiKey.startsWith('ISI_')||firebaseConfig.appId.startsWith('ISI_')){$('connection').textContent='⚙️ Isi apiKey dan appId Firebase terlebih dahulu di file HTML. Jangan gunakan data sensitif sebelum aturan akses diperketat.';render();return}try{const app=initializeApp(firebaseConfig);db=getDatabase(app);base='musaf2026/shared';await signInAnonymously(getAuth(app));onValue(ref(db,base),snap=>{const v=snap.val()||{};state={tasks:v.tasks||{},finance:v.finance||{}};connected=true;$('connection').className='notice good';$('connection').textContent='🟢 Tersambung • Data real-time';render()},err=>{$('connection').className='notice';$('connection').textContent='🔴 Akses database ditolak: '+err.message});}catch(err){$('connection').className='notice';$('connection').textContent='🔴 Firebase gagal terhubung: '+err.message}render()}
// Inisialisasi tugas bawaan: jalankan SATU KALI secara manual dari Console Firebase
// dengan mengimpor JSON hasil generator terpisah. Tidak otomatis menimpa tugas pengguna.
start();
</script></body></html>
